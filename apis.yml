aid: soldo-software-and-services
name: Soldo Software and Services
description: >-
  Soldo is a spend management platform that pairs prepaid Mastercard company cards with software
  for controlling, tracking, and reporting business spending. The Soldo Business API (v2) gives
  developers programmatic access to that platform - creating and controlling cards, managing
  wallets and internal transfers, searching and enriching transactions, running expense reviews
  and reports, handling business trips, vehicles, subscriptions, pre-approved spend, users, groups,
  and roles, plus a large webhook event surface for event-driven integrations. Authentication is
  OAuth 2.0 client-credentials, with an additional RSA request-signing layer (advanced
  authentication) for money movement and sensitive changes. Soldo is FCA-authorised and certified
  to PCI DSS Level 1, ISO/IEC 27001, ISO/IEC 9001, and Cyber Essentials Plus.
