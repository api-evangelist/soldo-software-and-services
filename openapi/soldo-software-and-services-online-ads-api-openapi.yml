openapi: 3.2.0
info:
  title: Soldo Software And Services Online Ads API
  version: 5.56.0
  description: 'Operations tagged Online Ads across 2 of this provider''s published API definitions: soldo-software-and-services-business-api-openapi.json, soldo-software-and-services-online-ads-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.soldo.com
  description: Production server (using live data)
- url: https://api-demo.soldocloud.net
  description: Sandbox server (using test data)
tags:
- name: Online Ads
paths:
  /business/v2/online-ads/{onlineAdId}:
    get:
      tags:
      - Online Ads
      summary: Get Online Ads
      description: Endpoint to get a specific `OnlineAd` by ID.
      operationId: online-ads-get
      parameters:
      - name: onlineAdId
        in: path
        required: true
        schema:
          type: string
          description: The `OnlineAd` ID.
          example: 7bf79328-a7ae-4222-aa54-091ff7f429a7
      responses:
        '200':
          description: The result is a single `OnlineAd`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineAds'
        '400':
          description: Your request has missing arguments or is malformed.
      security:
      - standardAuth:
        - online_ads_read
    put:
      tags:
      - Online Ads
      summary: Update Online Ads
      description: Endpoint to update a specific `OnlineAd`.
      operationId: online-ads-update
      parameters:
      - name: onlineAdId
        in: path
        required: true
        schema:
          type: string
          description: The `OnlineAd` ID.
          example: 7bf79328-a7ae-4222-aa54-091ff7f429a7
      - name: X-Soldo-Fingerprint
        in: header
        required: true
        schema:
          type: string
          description: '[Advanced authentication](ref:advanced-authentication): `SHA512SUM` of the fingerprint values listed in the fingerprint order for this endpoint.'
          example: '{{fingerprint}}'
          default: '{{fingerprint}}'
      - name: X-Soldo-Fingerprint-Signature
        in: header
        required: true
        schema:
          type: string
          description: '[Advanced authentication](ref:advanced-authentication): Signature of the `X-Soldo-Fingerprint`.'
          example: '{{fingerprint_signature}}'
          default: '{{fingerprint_signature}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOnlineAds'
      responses:
        '200':
          description: The returned resource is a single `OnlineAd`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineAds'
        '400':
          description: Your request has missing arguments or is malformed.
      security:
      - standardAuth:
        - online_ads_write
      x-soldo:
        fingerprint-order: id, name, wallet_id, token
    post:
      tags:
      - Online Ads
      summary: Activate Online Ads
      description: Endpoint to activate a specific `OnlineAd`.
      operationId: online-ads-activate
      parameters:
      - name: onlineAdId
        in: path
        required: true
        schema:
          type: string
          description: The `OnlineAd` ID.
          example: 7bf79328-a7ae-4222-aa54-091ff7f429a7
      - name: X-Soldo-Fingerprint
        in: header
        required: true
        schema:
          type: string
          description: '[Advanced authentication](ref:advanced-authentication): `SHA512SUM` of the fingerprint values listed in the fingerprint order for this endpoint.'
          example: '{{fingerprint}}'
          default: '{{fingerprint}}'
      - name: X-Soldo-Fingerprint-Signature
        in: header
        required: true
        schema:
          type: string
          description: '[Advanced authentication](ref:advanced-authentication): Signature of the `X-Soldo-Fingerprint`.'
          example: '{{fingerprint_signature}}'
          default: '{{fingerprint_signature}}'
      responses:
        '200':
          description: The `Order` of the reserved `Card` for the `OnlineAd`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Your request has missing arguments or is malformed.
      security:
      - standardAuth:
        - online_ads_write
      x-soldo:
        fingerprint-order: id, token
    delete:
      tags:
      - Online Ads
      summary: Delete Online Ads
      description: Endpoint to delete a specific `OnlineAd`.
      operationId: online-ads-delete
      parameters:
      - name: onlineAdId
        in: path
        required: true
        schema:
          type: string
          description: The `OnlineAd` ID.
          example: 7bf79328-a7ae-4222-aa54-091ff7f429a7
      responses:
        '204':
          description: No content as result.
        '400':
          description: Your request has missing arguments or is malformed.
      security:
      - standardAuth:
        - online_ads_write
    servers:
    - url: https://api.soldo.com
      description: Production server (using live data)
    - url: https://api-demo.soldocloud.net
      description: Sandbox server (using test data)
  /business/v2/online-ads/{onlineAdId}/addAssignees:
    put:
      tags:
      - Online Ads
      summary: Add assignees to Online Ads
      description: Endpoint to add assignees to an `OnlineAd`.
      operationId: online-ads-assignees-add
      parameters:
      - name: onlineAdId
        in: path
        required: true
        schema:
          type: string
          description: The `OnlineAd` ID.
          example: 7bf79328-a7ae-4222-aa54-091ff7f429a7
      - name: X-Soldo-Fingerprint
        in: header
        required: true
        schema:
          type: string
          description: '[Advanced authentication](ref:advanced-authentication): `SHA512SUM` of the fingerprint values listed in the fingerprint order for this endpoint.'
          example: '{{fingerprint}}'
          default: '{{fingerprint}}'
      - name: X-Soldo-Fingerprint-Signature
        in: header
        required: true
        schema:
          type: string
          description: '[Advanced authentication](ref:advanced-authentication): Signature of the `X-Soldo-Fingerprint`.'
          example: '{{fingerprint_signature}}'
          default: '{{fingerprint_signature}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAssignees'
      responses:
        '200':
          description: The returned resource is a single `OnlineAd`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineAds'
        '400':
          description: Your request has missing arguments or is malformed.
      security:
      - standardAuth:
        - online_ads_write
      x-soldo:
        fingerprint-order: id, token
    servers:
    - url: https://api.soldo.com
      description: Production server (using live data)
    - url: https://api-demo.soldocloud.net
      description: Sandbox server (using test data)
  /business/v2/online-ads:
    get:
      tags:
      - Online Ads
      summary: Search Online Ads
      description: Endpoint to search `OnlineAds` using filtering parameters.
      operationId: online-ads-search
      parameters:
      - name: text
        in: query
        description: A simple text to search in the `OnlineAds` data (name, description, assignee name).
        schema:
          type: string
          description: A simple text to search in the `OnlineAds` data (name, description, assignee name).
          example: onlinename
        example: onlinename
      - name: platforms
        in: query
        description: The `OnlineAds` platform.
        schema:
          uniqueItems: true
          type: array
          description: The `OnlineAds` platform.
          items:
            $ref: '#/components/schemas/OnlineAdsPlatform'
        example: GOOGLE
      - name: assignees
        in: query
        schema:
          uniqueItems: true
          type: array
          description: The `OnlineAds` assignees.
          example: 776f5018-07e5-426b-a426-8b23fa1e985d
          items:
            type: string
            description: The `OnlineAds` assignees.
            example: 776f5018-07e5-426b-a426-8b23fa1e985d
      - name: statuses
        in: query
        description: The Online Ad status.
        schema:
          uniqueItems: true
          type: array
          description: The Online Ad status.
          items:
            $ref: '#/components/schemas/OnlineAdsStatus'
        example: ACTIVE
      - name: p
        in: query
        description: It indicates the specific page to display (the counter starts from zero).
        schema:
          type: integer
          description: It indicates the specific page to display (the counter starts from zero).
          format: int32
          example: 3
          default: 0
        example: 3
      - name: s
        in: query
        description: It indicates the number of items per page.
        schema:
          maximum: 50
          type: integer
          description: It indicates the number of items per page.
          format: int32
          example: 25
          default: 0
        example: 25
      - name: d
        in: query
        description: It indicates how the pages are ordered.
        schema:
          $ref: '#/components/schemas/Direction'
        example: DESC
      - name: props
        in: query
        description: It indicates the sorting direction applied to the above parameters. To apply a sorting on multiple parameters, set as many times the `props` parameter in the request.
        schema:
          type: array
          description: It indicates the sorting direction applied to the above parameters. To apply a sorting on multiple parameters, set as many times the `props` parameter in the request.
          example: creationTime
          items:
            type: string
            description: It indicates the sorting direction applied to the above parameters. To apply a sorting on multiple parameters, set as many times the `props` parameter in the request.
            example: creationTime
        example: creationTime
      responses:
        '200':
          description: The result is an array containing `OnlineAds`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineAdsList'
        '400':
          description: Your request has missing arguments or is malformed.
      security:
      - standardAuth:
        - online_ads_read
    post:
      tags:
      - Online Ads
      summary: Add Online Ads
      description: Endpoint to add a new `OnlineAd`.
      operationId: online-ads-add
      parameters:
      - name: X-Soldo-Fingerprint
        in: header
        required: true
        schema:
          type: string
          description: '[Advanced authentication](ref:advanced-authentication): `SHA512SUM` of the fingerprint values listed in the fingerprint order for this endpoint.'
          example: '{{fingerprint}}'
          default: '{{fingerprint}}'
      - name: X-Soldo-Fingerprint-Signature
        in: header
        required: true
        schema:
          type: string
          description: '[Advanced authentication](ref:advanced-authentication): Signature of the `X-Soldo-Fingerprint`.'
          example: '{{fingerprint_signature}}'
          default: '{{fingerprint_signature}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOnlineAds'
      responses:
        '200':
          description: The result is an `OnlineAd`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineAds'
        '400':
          description: Your request has missing arguments or is malformed.
      security:
      - standardAuth:
        - online_ads_write
      x-soldo:
        fingerprint-order: name, platform, wallet_id, token
    servers:
    - url: https://api.soldo.com
      description: Production server (using live data)
    - url: https://api-demo.soldocloud.net
      description: Sandbox server (using test data)
  /business/v2/online-ads/{onlineAdId}/removeAssignees:
    put:
      tags:
