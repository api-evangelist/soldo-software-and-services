components:
  schemas:
    UpdateOnlineAds:
      type: object
      properties:
        name:
          type: string
          description: The name of the `OnlineAds`.
          example: Google Ads
        description:
          type: string
          description: The description `OnlineAds`.
          example: Google Ads Campaign
        wallet_id:
          type: string
          description: The `Wallet` ID associated to the `OnlineAds`.
          example: 7bf79328-a7ae-4222-aa54-091ff7f429a7
      description: Update `OnlineAd` JSON parameters.
    OnlineAdsAssigneeAddedEvent:
      type: object
      properties:
        event_uuid:
          type: string
          description: The webhook unique ID.
          example: 7bf79328-a7ae-4222-aa54-091ff7f429a7
        event_type:
          $ref: '#/components/schemas/WebhookEventType'
        event_name:
          $ref: '#/components/schemas/WebhookEventName'
        company_account_id:
          type: string
          description: The company account ID.
          example: XMPL1234
        data:
          $ref: '#/components/schemas/OnlineAds'
        subscription_id:
          type: string
          description: The webhook subscription ID used to route this event.
          example: 2d65bd5e-3fdf-4002-b166-bde7fb8863fa
    CreateOnlineAds:
      required:
      - assignees
      - description
      - name
      - platform
      - wallet_id
      type: object
      properties:
        name:
          type: string
          description: The name of the `OnlineAds`.
          example: Google Ads
        description:
          type: string
          description: The description of the `OnlineAds`.
          example: Google Ads Campaign
        platform:
          $ref: '#/components/schemas/OnlineAdsPlatform'
        assignees:
          uniqueItems: true
          type: array
          description: List of `User` IDs to be assigned to the `OnlineAds` and its `Cards`.
          example:
          - XMPL1234-000001
          - XMPL1234-000002
          - XMPL1234-000003
          items:
            type: string
            description: List of `User` IDs to be assigned to the `OnlineAds` and its `Cards`.
            example: '["XMPL1234-000001","XMPL1234-000002","XMPL1234-000003"]'
        wallet_id:
          type: string
          description: The `Wallet` ID associated to the `OnlineAds`.
          example: 2d65bd5e-3fdf-4002-b166-bde7fb8863fa
      description: Add `OnlineAd` JSON parameters.
    OnlineAds:
      type: object
      properties:
        id:
          type: string
          description: The `OnlineAds` ID.
          example: 7bf79328-a7ae-4222-aa54-091ff7f429a7
        name:
          type: string
          description: The name of the `OnlineAds`.
          example: EXAMPLE ONLINE AD
        description:
          type: string
          description: A custom description of the `OnlineAds`.
          example: This is an online advertisement
        platform:
          $ref: '#/components/schemas/OnlineAdsPlatform'
        assignees:
          type: array
          description: List of `User` IDs currently assigned to the `OnlineAds` and its `Cards`.
          example:
          - XMPL1234-000001
