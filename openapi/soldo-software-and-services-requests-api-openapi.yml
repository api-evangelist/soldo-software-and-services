      security:
      - standardAuth:
        - request_read
    put:
      tags:
      - Requests
      summary: Update Request
      description: Endpoint to update an `Request`. There are 3 types of request:GOODS_OR_SERVICES, FUNDS, TRIP.
      operationId: request-update
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          description: The `Request` ID.
