    TransferResult:
      type: object
      properties:
        amount:
          type: number
          description: The transferred amount.
          example: 10.25
        currency:
          $ref: '#/components/schemas/ISO4217Currency'
        datetime:
          type: string
          description: The date and time of the transaction.
          example: '2017-06-01T12:48:40Z'
        from_wallet:
          $ref: '#/components/schemas/Wallet'
        to_wallet:
          $ref: '#/components/schemas/Wallet'
    Direction:
      type: string
      description: It indicates how the pages are ordered.
      example: DESC
      enum:
      - ASC
      - DESC
    AddWalletOwnerType:
      type: string
      description: The type of the owner of the `Wallet`.
      example: company
      enum:
      - company
    OrderItem:
      type: object
      properties:
        id:
          type: string
          description: The ID of a single item of a specific `Order`.
          example: 7bf79328-a7ae-4222-aa54-091ff7f429a7
        item_type:
          type: string
          description: The type of the ordered item.
          example: CARD
        category:
          type: string
          description: The category of the ordered item.
      description: The products associated with the `Order`.
    PrimaryUserType:
      type: string
      description: The type of resource assigned to the `Wallet`.
      example: company
      enum:
      - main
      - company
      - employee
      - dedicated
    ISO4217SupportedCurrency:
      type: string
      description: The [ISO 4217](https://www.six-group.com/en/products-services/financial-information/data-standards.html#scrollTo=maintenance-agency) code of the currency of the `Statement` to search for.
      example: EUR
      enum:
      - EUR
      - GBP
      - USD
    WalletDeletedEvent:
      type: object
      properties:
        event_uuid:
          type: string
          description: The webhook unique ID.
          example: 7bf79328-a7ae-4222-aa54-091ff7f429a7
        event_type:
          $ref: '#/components/schemas/WebhookEventType'
        event_name:
          $ref: '#/components/schemas/WebhookEventName'
        company_account_id:
          type: string
          description: The company account ID.
          example: XMPL1234
        data:
          $ref: '#/components/schemas/Wallet'
        subscription_id:
          type: string
          description: The webhook subscription ID used to route this event.
          example: 2d65bd5e-3fdf-4002-b166-bde7fb8863fa
    UpdateWallet:
      required:
      - description
      - label
      - name
      type: object
      properties:
        name:
          type: string
          description: The `Wallet` name.
          example: John Doe
        label:
          type: string
          description: The `Wallet` label.
          example: JD
        description:
          type: string
          description: The `Wallet` description.
          example: My company wallet
      description: The `Wallet` JSON parameters.
    CreateWallet:
      required:
      - currency
      - name
      - request_timestamp
      type: object
      properties:
        request_timestamp:
          type: integer
          description: The epoch timestamp in millis. This is checked in Soldo. Requests with timestamp older than 5 seconds will be rejected.
          format: int64
          example: 1576850500000
        name:
          type: string
          description: The name of the `Wallet`.
          example: John Doe
        description:
          type: string
          description: The description of the `Wallet`.
          example: My company wallet
